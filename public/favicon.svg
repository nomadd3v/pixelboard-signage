<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Pixelboard">
  <defs>
    <linearGradient id="pb" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E6BFF"/>
      <stop offset="0.5" stop-color="#7B2FF7"/>
      <stop offset="1" stop-color="#FF2EC4"/>
    </linearGradient>
  </defs>
  <!-- Pixelboard mark: a board/screen made of pixels, with pixels lifting off the top-right.
       Unit grid: 4px cells, 0.6px gaps, ~0.9px corner radius. -->
  <g fill="url(#pb)">
    <!-- board: 5 columns x 4 rows -->
    <rect x="3"  y="9"  width="3.4" height="3.4" rx="0.9"/>
    <rect x="7"  y="9"  width="3.4" height="3.4" rx="0.9"/>
    <rect x="11" y="9"  width="3.4" height="3.4" rx="0.9"/>
    <rect x="15" y="9"  width="3.4" height="3.4" rx="0.9"/>
    <rect x="19" y="9"  width="3.4" height="3.4" rx="0.9"/>

    <rect x="3"  y="13" width="3.4" height="3.4" rx="0.9"/>
    <rect x="7"  y="13" width="3.4" height="3.4" rx="0.9"/>
    <rect x="11" y="13" width="3.4" height="3.4" rx="0.9"/>
    <rect x="15" y="13" width="3.4" height="3.4" rx="0.9"/>
    <rect x="19" y="13" width="3.4" height="3.4" rx="0.9"/>

    <rect x="3"  y="17" width="3.4" height="3.4" rx="0.9"/>
    <rect x="7"  y="17" width="3.4" height="3.4" rx="0.9"/>
    <rect x="11" y="17" width="3.4" height="3.4" rx="0.9"/>
    <rect x="15" y="17" width="3.4" height="3.4" rx="0.9"/>
    <rect x="19" y="17" width="3.4" height="3.4" rx="0.9"/>

    <rect x="3"  y="21" width="3.4" height="3.4" rx="0.9"/>
    <rect x="7"  y="21" width="3.4" height="3.4" rx="0.9"/>
    <rect x="11" y="21" width="3.4" height="3.4" rx="0.9"/>
    <rect x="15" y="21" width="3.4" height="3.4" rx="0.9"/>
    <rect x="19" y="21" width="3.4" height="3.4" rx="0.9"/>

    <!-- scattering pixels off the top-right corner, shrinking + fading -->
    <rect x="23.4" y="9"   width="3.0" height="3.0" rx="0.8" opacity="0.95"/>
    <rect x="24.0" y="4.8" width="2.4" height="2.4" rx="0.7" opacity="0.8"/>
    <rect x="27.4" y="6.6" width="1.8" height="1.8" rx="0.5" opacity="0.6"/>
    <rect x="28.6" y="2.8" width="1.3" height="1.3" rx="0.4" opacity="0.45"/>
  </g>
</svg>
