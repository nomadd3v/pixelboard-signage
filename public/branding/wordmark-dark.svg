<svg xmlns="http://www.w3.org/2000/svg" width="520" height="120" viewBox="0 0 520 120" role="img" aria-label="Pixelboard">
  <defs>
    <linearGradient id="pbd" x1="0" y1="0" x2="520" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E6BFF"/>
      <stop offset="0.5" stop-color="#7B2FF7"/>
      <stop offset="1" stop-color="#FF2EC4"/>
    </linearGradient>
  </defs>

  <!-- Mark (pixel board + scattering pixels), 96x96 box at left, padded -->
  <g transform="translate(12,12)" fill="url(#pbd)">
    <rect x="9"  y="27" width="13.6" height="13.6" rx="3.6"/>
    <rect x="25" y="27" width="13.6" height="13.6" rx="3.6"/>
    <rect x="41" y="27" width="13.6" height="13.6" rx="3.6"/>
    <rect x="57" y="27" width="13.6" height="13.6" rx="3.6"/>
    <rect x="9"  y="43" width="13.6" height="13.6" rx="3.6"/>
    <rect x="25" y="43" width="13.6" height="13.6" rx="3.6"/>
    <rect x="41" y="43" width="13.6" height="13.6" rx="3.6"/>
    <rect x="57" y="43" width="13.6" height="13.6" rx="3.6"/>
    <rect x="9"  y="59" width="13.6" height="13.6" rx="3.6"/>
    <rect x="25" y="59" width="13.6" height="13.6" rx="3.6"/>
    <rect x="41" y="59" width="13.6" height="13.6" rx="3.6"/>
    <rect x="57" y="59" width="13.6" height="13.6" rx="3.6"/>
    <rect x="9"  y="75" width="13.6" height="13.6" rx="3.6"/>
    <rect x="25" y="75" width="13.6" height="13.6" rx="3.6"/>
    <rect x="41" y="75" width="13.6" height="13.6" rx="3.6"/>
    <rect x="57" y="75" width="13.6" height="13.6" rx="3.6"/>
    <rect x="73" y="27" width="12" height="12" rx="3.2" opacity="0.95"/>
    <rect x="76" y="9"  width="9.5" height="9.5" rx="2.6" opacity="0.78"/>
    <rect x="90" y="17" width="7"  height="7"  rx="2"   opacity="0.58"/>
  </g>

  <!-- Wordmark (light text for dark backgrounds) -->
  <text x="128" y="76"
        font-family="'Inter','Helvetica Neue',Arial,system-ui,sans-serif"
        font-size="56" font-weight="700" letter-spacing="-1.5"
        fill="#FFFFFF">Pixel<tspan fill="url(#pbd)">board</tspan></text>
</svg>
